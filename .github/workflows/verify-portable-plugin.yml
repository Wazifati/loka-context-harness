name: Verify portable plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile local Python utilities
        run: python -m py_compile runner/run_eval.py smoke_test/dry_run.py tools/sync_portable_plugin.py
      - name: Verify plugin mirrors canonical sources
        run: python tools/sync_portable_plugin.py --check
      - name: Run deterministic synthetic pipeline check
        run: python smoke_test/dry_run.py
